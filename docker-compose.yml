# Startet die gesamte Anwendung mit einem einzigen Befehl: docker compose up
# Setzt die im Konzept beschriebene 2-Container-Architektur um
# (siehe Konzept, Abb. 3: "Architektur mit zwei Docker-Containern in einem
# gemeinsamen Netzwerk").

services:
  dash-app:
    build:
      context: .
      dockerfile: app/Dockerfile
    ports:
      - "8050:8050"
    environment:
      - ML_SERVICE_URL=http://ml-service:8001
    depends_on:
      - ml-service
    volumes:
      - shared-data:/data
    networks:
      - summarizer-net

  ml-service:
    build:
      context: .
      dockerfile: ml_service/Dockerfile
    ports:
      - "8001:8001"
    volumes:
      - shared-data:/data
    networks:
      - summarizer-net

networks:
  summarizer-net:
    driver: bridge

volumes:
  shared-data:
